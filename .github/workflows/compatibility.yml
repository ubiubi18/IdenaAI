name: Compatibility evidence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compatibility.yml
      - compatibility/**
      - scripts/build-node-evidence.js
      - scripts/build-node-from-sources.js
      - scripts/check-compatibility-lock.js
      - scripts/check-node-build-evidence.js
      - scripts/check-promotion-evidence.js
      - scripts/setup-sources.js
      - scripts/source-manifest.json
  pull_request:
    paths:
      - .github/workflows/compatibility.yml
      - compatibility/**
      - scripts/build-node-evidence.js
      - scripts/build-node-from-sources.js
      - scripts/check-compatibility-lock.js
      - scripts/check-node-build-evidence.js
      - scripts/check-promotion-evidence.js
      - scripts/setup-sources.js
      - scripts/source-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-compatibility:
    name: Wasm receipt and gas (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH || process.platform !== process.env.EXPECTED_PLATFORM) { throw new Error("unexpected runner " + process.platform + "/" + process.arch) }'

      - name: Verify compatibility lock
        run: node scripts/check-compatibility-lock.js

      - name: Prepare pinned source mirrors
        run: node scripts/setup-sources.js --target-root .tmp/compatibility-sources

      - name: Run fixed Wasm receipt and gas vectors
        run: |
          set -euo pipefail
          source_root="${PWD}/.tmp/compatibility-sources"
          idena_go="${source_root}/idena-go"
          binding="${source_root}/idena-wasm-binding"
          mod_dir="$(mktemp -d)"
          trap 'rm -rf "${mod_dir}"' EXIT
          cp "${idena_go}/go.mod" "${mod_dir}/idena.mod"
          cp "${idena_go}/go.sum" "${mod_dir}/idena.sum"
          (
            cd "${idena_go}"
            ./scripts/run-go-toolchain.sh mod edit \
              "-modfile=${mod_dir}/idena.mod" \
              "-replace=github.com/idena-network/idena-wasm-binding=${binding}"
            ./scripts/run-go-toolchain.sh test \
              "-modfile=${mod_dir}/idena.mod" \
              -mod=readonly \
              ./vm/wasm \
              -count=1
          )
        shell: bash

  reproducible-node:
    name: Node rebuild (${{ matrix.builder_id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        builder_id:
          - github-hosted-a
          - github-hosted-b
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Verify compatibility lock
        run: node scripts/check-compatibility-lock.js

      - name: Build node from fresh pinned sources
        run: >-
          node scripts/build-node-evidence.js
          --builder-id "${{ matrix.builder_id }}"
          --report "build/compatibility/node-build-${{ matrix.builder_id }}.json"

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-build-${{ matrix.builder_id }}
          path: build/compatibility/node-build-${{ matrix.builder_id }}.json
          if-no-files-found: error
          retention-days: 14

  verify-reproducible-node:
    name: Verify independent node rebuilds
    needs: reproducible-node
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Verify compatibility lock
        run: node scripts/check-compatibility-lock.js

      - name: Download build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build/compatibility
          merge-multiple: true

      - name: Compare node build digests
        run: >-
          node scripts/check-node-build-evidence.js
          build/compatibility/node-build-github-hosted-a.json
          build/compatibility/node-build-github-hosted-b.json
