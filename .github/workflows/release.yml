name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_builder_args: --mac --publish always
          - os: ubuntu-latest
            electron_builder_args: --linux --publish always
          - os: windows-2022
            electron_builder_args: --win --publish always
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Validate immutable release tag
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${RELEASE_REF_NAME#refs/tags/}"
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Release tag must be annotated: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Release tag does not match the triggering commit: ${tag}" >&2
            exit 1
          fi
          if [[ -z "${RELEASE_DEFAULT_BRANCH}" ]]; then
            echo "Repository default branch is missing" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/${RELEASE_DEFAULT_BRANCH}:refs/remotes/origin/${RELEASE_DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/${RELEASE_DEFAULT_BRANCH}"; then
            echo "Release tag is not on the repository default branch: ${tag}" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status="$(curl --silent --show-error --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "${status}" in
            404) ;;
            200)
              echo "Refusing to overwrite published release tag: ${tag}" >&2
              exit 1
              ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              cat "${response_file}" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5

      - name: Install dependencies
        run: npm ci

      - name: Verify source mirror clone
        run: npm run setup:sources -- --target-root .tmp/source-mirror-check

      - name: Prepare source mirrors
        run: npm run setup:sources

      - name: Run release check
        run: npm run release:check

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Install embedded social dependencies
        run: npm ci --prefix vendor/idena.social-ui

      - name: Check embedded social UI
        run: |
          npm run lint --prefix vendor/idena.social-ui
          npm test --prefix vendor/idena.social-ui

      - name: Bump version
        env:
          RELEASE_TAG: ${{ steps.refs.outputs.tag }}
        run: npm --no-git-tag-version version --allow-same-version "${RELEASE_TAG}"
        shell: bash

      - name: Build renderer
        run: npm run build

      - name: Build and release
        env:
          ELECTRON_BUILDER_ARGS: ${{ matrix.electron_builder_args }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -a electron_builder_args <<< "${ELECTRON_BUILDER_ARGS}"
          node scripts/run-electron-builder.js "${electron_builder_args[@]}"
        shell: bash
