name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      commit: ${{ steps.refs.outputs.commit }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate immutable release tag
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_REF_NAME#refs/tags/}"
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Release tag must be annotated: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag: ${tag}" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status="$(curl --silent --show-error --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "${status}" in
            404) ;;
            200)
              echo "Refusing to overwrite published release tag: ${tag}" >&2
              exit 1
              ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              cat "${response_file}" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Require checked-in release version
        env:
          RELEASE_TAG: ${{ steps.refs.outputs.tag }}
        run: node scripts/check-release-version.js

      - name: Require approved compatibility stack
        run: node scripts/check-compatibility-lock.js --require-approved

      - name: Require independently approved application release
        run: node scripts/check-application-release-lock.js --require-approved

      - name: Resolve approved candidate source
        id: candidate
        run: |
          node <<'NODE'
          const fs = require('fs')
          const {candidateSource} = require('./compatibility/application-release-lock.json')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `run_id=${candidateSource.runId}\ncommit=${candidateSource.commit}\n`)
          NODE

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8

      - name: Install dependencies
        run: npm ci

      - name: Verify source mirror clone
        run: npm run setup:sources -- --target-root .tmp/source-mirror-check

      - name: Prepare source mirrors
        run: npm run setup:sources

      - name: Run release check
        run: npm run release:check

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run noVNC clipboard tests
        run: npm run test:novnc-clipboard

      - name: Install embedded social dependencies
        run: npm ci --prefix vendor/idena.social-ui

      - name: Check embedded social UI
        run: |
          npm run lint --prefix vendor/idena.social-ui
          npm test --prefix vendor/idena.social-ui

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Audit optional Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt --progress-spinner off

  release:
    needs: release-preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            artifact_name: release-macos
          - target: linux-x64
            artifact_name: release-linux
          - target: win32-x64
            artifact_name: release-windows
    steps:
      - name: Check out approved release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0

      - name: Verify approved candidate workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ needs.release-preflight.outputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ needs.release-preflight.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" |
            node scripts/check-candidate-run.js "${CANDIDATE_RUN_ID}" "${CANDIDATE_COMMIT}" "${GITHUB_REPOSITORY}"
        shell: bash

      - name: Download approved candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.release-preflight.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: candidate-${{ matrix.target }}-${{ needs.release-preflight.outputs.candidate_commit }}
          path: build/candidate-input

      - name: Verify and stage approved release artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/check-application-release-artifacts.js --target "${RELEASE_TARGET}" --artifact-root build/candidate-input
        shell: bash

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: build/release-verified/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs:
      - release-preflight
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -d '' assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          printf '%s\0' "${assets[@]}" | xargs -0 sha256sum > SHA256SUMS
          assets+=(./SHA256SUMS)
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-from-tag
        shell: bash
