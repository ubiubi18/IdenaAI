name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      commit: ${{ steps.refs.outputs.commit }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate immutable release tag
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_REF_NAME#refs/tags/}"
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Release tag must be annotated: ${tag}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "refs/tags/${tag}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag: ${tag}" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status="$(curl --silent --show-error --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "${status}" in
            404) ;;
            200)
              echo "Refusing to overwrite published release tag: ${tag}" >&2
              exit 1
              ;;
            *)
              echo "GitHub release lookup failed with HTTP ${status}" >&2
              cat "${response_file}" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit optional Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt --progress-spinner off

  release:
    needs: release-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron_builder_args: --mac --publish always
          - os: ubuntu-latest
            electron_builder_args: --linux --publish always
          - os: windows-2022
            electron_builder_args: --win --publish always
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5

      - name: Install dependencies
        run: npm ci

      - name: Verify source mirror clone
        run: npm run setup:sources -- --target-root .tmp/source-mirror-check

      - name: Prepare source mirrors
        run: npm run setup:sources

      - name: Run release check
        run: npm run release:check

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Install embedded social dependencies
        run: npm ci --prefix vendor/idena.social-ui

      - name: Check embedded social UI
        run: |
          npm run lint --prefix vendor/idena.social-ui
          npm test --prefix vendor/idena.social-ui

      - name: Bump version
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: npm --no-git-tag-version version --allow-same-version "${RELEASE_TAG}"
        shell: bash

      - name: Build renderer
        run: npm run build

      - name: Build and release
        env:
          ELECTRON_BUILDER_ARGS: ${{ matrix.electron_builder_args }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -a electron_builder_args <<< "${ELECTRON_BUILDER_ARGS}"
          node scripts/run-electron-builder.js "${electron_builder_args[@]}"
        shell: bash
